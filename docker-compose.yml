services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dentstarlab-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    container_name: dentstarlab-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

volumes:
  sqlserver_data:
  seq_data: