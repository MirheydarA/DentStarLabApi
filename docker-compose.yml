services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dentstarlab-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentstarlab-api
    restart: unless-stopped
    depends_on:
      - sqlserver
    ports:
      - "10000:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:10000
      FrontendUrl: dentstarlab-web.vercel.app
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DentStarLabDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Issuer: "DentStarLab"
      Jwt__Audience: "DentStarLab"
      Jwt__Key: "${JWT_KEY}"
      Telegram__BotToken: ""
      Telegram__ChatId: ""

volumes:
  sqlserver_data: